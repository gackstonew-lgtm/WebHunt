<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>WebHunt | Offline</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background-color: #050505;
      color: #F2F7F3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .offline-card {
      width: 100%;
      max-width: 440px;
      background-color: #121212;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.9);
    }
    .icon-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px auto;
      border-radius: 18px;
      background-color: #1A1A1A;
      border: 1px solid rgba(45, 125, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2D7DFF;
      box-shadow: 0 4px 20px rgba(45, 125, 255, 0.15);
    }
    .icon-badge svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #F2F7F3;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #8EA79C;
      margin: 0 0 26px 0;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 200px;
      padding: 12px 20px;
      background-color: #0251B8;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
      outline: none;
    }
    .btn-retry:hover {
      background-color: #014196;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .btn-retry:focus-visible {
      box-shadow: 0 0 0 3px rgba(45, 125, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="offline-card" role="region" aria-label="Offline notice">
    <div class="icon-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="m2 2 20 20"></path>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M4.93 12.93a10 10 0 0 1 3.57-2.43"></path>
        <path d="M12 4a10 10 0 0 1 7.07 2.93"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You Are Currently Offline</h1>
    <p>WebHunt live lead discovery radar and search tools require an active network connection. Reconnect to resume scanning.</p>
    <button type="button" class="btn-retry" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
</body>
</html>
